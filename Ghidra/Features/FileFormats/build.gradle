apply from: "$rootProject.projectDir/gradle/distributableGhidraModule.gradle"
apply from: "$rootProject.projectDir/gradle/javaProject.gradle"
apply from: "$rootProject.projectDir/gradle/helpProject.gradle"
apply from: "$rootProject.projectDir/gradle/jacocoProject.gradle"
apply from: "$rootProject.projectDir/gradle/javaTestProject.gradle"
apply from: "$rootProject.projectDir/gradle/nativeProject.gradle"
apply from: "buildNatives.gradle"
apply plugin: 'eclipse'

eclipse.project.name = 'Features FileFormats'

dependencies {

	api project(':Base')
	api project(':Recognizers')
	api project(':PDB')

	// Used by "Android DEX to JAR" file system
	// dex2jar depends on asm-9.7.1, which is declared in Framework/Emulation
	api 'de.femtopedia.dex2jar:dex-ir:2.4.24'
	api 'de.femtopedia.dex2jar:dex-reader:2.4.24'
	api 'de.femtopedia.dex2jar:dex-reader-api:2.4.24'
	api 'de.femtopedia.dex2jar:dex-translator:2.4.24'

	// Used by "Android DEX to SMALI" file system
	api 'org.smali:baksmali:2.5.2' // requires guava-27.1-android or later
	api 'org.smali:dexlib2:2.5.2'  // requires guava-27.1-android or later
	api 'org.smali:util:2.5.2'     // requires guava-27.1-android or later

	// Used by "Android XML" file system
	api ':AXMLPrinter2'

	// Used by "ZIP" and "7zip" file systems
	api 'net.sf.sevenzipjbinding:sevenzipjbinding:16.02-2.01'	
	runtimeOnly 'net.sf.sevenzipjbinding:sevenzipjbinding-all-platforms:16.02-2.01'
	
	// include code from src/test/slow in Base
	testImplementation project(path: ':Base', configuration: 'integrationTestArtifacts')	
}

// Include buildable native source in distribution
rootProject.assembleDistribution {
	from (this.project.projectDir.toString()) {
		include "src/lzfse/**"
		into  { getZipPath(this.project) }
	}
}

// ***********************************************************************************************
// Sevenzip native library extract task
// ***********************************************************************************************
// The following extracts native libraries from upstream's sevenzipjbinding allPlatform jar
// and places the uncompressed native libraries into a ghidra folder so that they can be used to
// initialize the sevenzipjbinding library without needing to extract the native libraries at run time.
// This is necessary due to bugs in upstream's initSevenZipFromPlatformJAR() that can cause core
// dumps in java processes that have previously loaded the native library.  See comments
// at the top of ghidra.file.formats.sevenzip.SevenZipCustomInitializer.
// This gradle task can be removed when SevenZipCustomInitializer is no longer needed.
String getSevenZipJarPath() {
    List<String> libs = getExternalRuntimeDependencies(project);
    for(String lib: libs) {
        if (lib.contains("sevenzipjbinding-all-platforms")) {
            return lib;
        }
    }
    return null
}

task extractSevenZipNativeLibs(type: Copy) {
	gradle.taskGraph.whenReady {
	    String jarPath = getSevenZipJarPath();
	    from zipTree(jarPath)
	    include  "Linux-amd64/*.so"
	    include  "Windows-amd64/*.dll"
	    include  "Mac-x86_64/*.dylib"
	    exclude "META-INF"
	    exclude "Linux-i386"
	    exclude "Windows-x86"
	    into ("build/data/sevenzipnativelibs") 
    }   
}

// Run an external process, fully draining stdout/stderr to avoid pipe deadlocks.
// Returns [exitCode, combinedOutput]
def runProcess(List cmd, File workDir) {
	// ProcessBuilder requires a pure List<String>; GString elements cause arraycopy errors
	List<String> args = cmd.collect { it == null ? "" : it.toString() }
	def pb = new ProcessBuilder(args)
	if (workDir != null) {
		pb.directory(workDir)
	}
	pb.redirectErrorStream(true)
	def proc = pb.start()
	def out = new StringBuilder()
	proc.inputStream.eachLine { line ->
		out.append(line).append('\n')
		logger.lifecycle(line)
	}
	proc.waitFor()
	return [proc.exitValue(), out.toString()]
}

// Build sevenzipjbinding native library for Windows ARM64 from source.
// Upstream does not ship a Windows ARM64 binary, so we cross-compile it
// from the sevenzipjbinding GitHub source using CMake + Visual Studio.
// Only runs on Windows with cmake available.
task buildSevenZipWinARM64 {
	dependsOn extractSevenZipNativeLibs
	outputs.upToDateWhen { false }
	
	doLast {
		// Only run on Windows
		if (!System.properties['os.name'].toLowerCase().contains('windows')) {
			return
		}
		
		def gitTag = "16.02-2.01"
		def srcArchive = project.file("${buildDir}/sevenzip-src.tar.gz")
		def srcDir = project.file("${buildDir}/sevenzip-src")
		def cmakeBuildDir = project.file("${buildDir}/sevenzip-arm64")
		def outputDir = project.file("build/data/sevenzipnativelibs/Windows-amd64")
		
		// Check cmake availability
		def (cmakeExit, cmakeVer) = runProcess(['cmake', '--version'], null)
		if (cmakeExit != 0) {
			logger.warn("cmake not found, skipping Windows ARM64 7-Zip native build. " +
				"Install CMake (choco install cmake) and ensure it is in PATH.")
			return
		}
		
		// Download source
		if (!srcArchive.exists() || srcArchive.length() < 1000) {
			def srcUrl = "https://github.com/borisbrodski/sevenzipjbinding/archive/refs/tags/Release-${gitTag}.tar.gz"
			logger.lifecycle("Downloading sevenzipjbinding source from {} ...", srcUrl)
			srcArchive.parentFile.mkdirs()
			project.ant.get(src: srcUrl, dest: srcArchive, verbose: true)
		}
		
		// Extract source
		if (!new File(srcDir, "CMakeLists.txt").exists()) {
			if (srcDir.exists()) {
				srcDir.deleteDir()
			}
			srcDir.parentFile.mkdirs()
			project.ant.untar(src: srcArchive, dest: srcDir.parentFile, compression: "gzip")
			def extracted = new File(srcDir.parentFile, "sevenzipjbinding-Release-${gitTag}")
			if (extracted.exists()) {
				if (srcDir.exists()) {
					srcDir.deleteDir()
				}
				extracted.renameTo(srcDir)
			}
		}
		if (!new File(srcDir, "CMakeLists.txt").exists()) {
			logger.warn("sevenzipjbinding source missing CMakeLists.txt at {}, skipping.", srcDir)
			return
		}
		// CMake 4.x removed compatibility with cmake_minimum_required < 3.5
		def cmakeLists = new File(srcDir, "CMakeLists.txt")
		def cmakeListsText = cmakeLists.getText('UTF-8')
		if (cmakeListsText.contains('CMAKE_MINIMUM_REQUIRED(VERSION 2.')) {
			cmakeListsText = cmakeListsText.replaceFirst(
				/CMAKE_MINIMUM_REQUIRED\(VERSION\s+[\d.]+\)/,
				'CMAKE_MINIMUM_REQUIRED(VERSION 3.5)')
			cmakeLists.write(cmakeListsText, 'UTF-8')
			logger.lifecycle("Patched sevenzipjbinding CMakeLists.txt for CMake 4.x")
		}
		logger.lifecycle("sevenzipjbinding source ready at {}", srcDir)
		
		// Configure CMake for ARM64
		if (cmakeBuildDir.exists()) {
			cmakeBuildDir.deleteDir()
		}
		cmakeBuildDir.mkdirs()
		logger.lifecycle("Configuring sevenzipjbinding CMake for Windows ARM64 ...")
		def (cfgExit, cfgOut) = runProcess([
			'cmake',
			"-G", "Visual Studio 17 2022",
			"-A", "ARM64",
			"-DCMAKE_BUILD_TYPE=Release",
			"-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
			"-DJAVA_HOME=${project.JAVA_HOME}",
			srcDir.absolutePath
		], cmakeBuildDir)
		if (cfgExit != 0) {
			logger.warn("CMake configure failed for Windows ARM64 7-Zip (exit {}).", cfgExit)
			return
		}
		
		// Build
		logger.lifecycle("Building sevenzipjbinding for Windows ARM64 (this may take a few minutes) ...")
		def (buildExit, buildOut) = runProcess([
			'cmake', '--build', '.', '--config', 'Release', '--target', 'SevenZipJBinding'
		], cmakeBuildDir)
		if (buildExit != 0) {
			logger.warn("CMake build failed for Windows ARM64 7-Zip native library (exit {}).", buildExit)
			return
		}
		
		// Copy ARM64 DLL into Windows-amd64 directory (same filename, ARM64 binary)
		// The SevenZipCustomInitializer maps Windows-arm64 -> Windows-amd64,
		// so this ARM64 DLL will be loaded when running on ARM64 Windows.
		outputDir.mkdirs()
		def src7z = new File("${cmakeBuildDir}/bin/Release/7-Zip-JBinding.dll")
		if (!src7z.exists()) {
			// Fallback: search the build tree
			src7z = fileTree(cmakeBuildDir) {
				include "**/7-Zip-JBinding.dll"
			}.files.find { true }
		}
		if (src7z == null || !src7z.exists()) {
			logger.warn("7-Zip-JBinding.dll not found after build under {}", cmakeBuildDir)
			return
		}
		new File(outputDir, "7-Zip-JBinding.dll").bytes = src7z.bytes
		logger.lifecycle("Windows ARM64 7-Zip native library built and installed from {}.", src7z)
	}
}

jar.dependsOn buildSevenZipWinARM64

rootProject.prepDev.dependsOn extractSevenZipNativeLibs
jar.dependsOn extractSevenZipNativeLibs
// end of sevenzip native library extract task code

