name: Build Ghidra 12.1.2 Windows ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - build-win-arm64

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME_21_AARCH64" | Out-File -FilePath $env:GITHUB_ENV -Append

      # sevenzipjbinding only builds on Windows with MinGW; install llvm-mingw for ARM64.
      - name: Install llvm-mingw (ARM64)
        shell: pwsh
        run: |
          $ver = "20260616"
          $zip = "llvm-mingw-$ver-ucrt-aarch64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$zip"
          $dest = "$env:RUNNER_TEMP\llvm-mingw"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $out = "$env:RUNNER_TEMP\$zip"
          Write-Host "Downloading $url ..."
          Invoke-WebRequest -Uri $url -OutFile $out
          Expand-Archive -Path $out -DestinationPath $dest -Force
          $bin = Get-ChildItem -Path $dest -Recurse -Filter "aarch64-w64-mingw32-clang.exe" |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $bin) { throw "llvm-mingw toolchain not found after extract" }
          echo "LLVM_MINGW_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$bin\aarch64-w64-mingw32-clang.exe" --version

      - name: Patch settings for Gradle 9 and ARM64
        shell: pwsh
        run: |
          $util = Get-Content "$pwd\gradle\support\settingsUtil.gradle" -Raw
          $util = $util -replace "File projectDir = new File\(rootProject\.projectDir, `"\$path/\$dirName`"\)", "def projectDir = settings.file(`"\$path/\$dirName`")"
          $util | Set-Content "$pwd\gradle\support\settingsUtil.gradle"

          $settings = Get-Content "$pwd\settings.gradle"
          $settings = $settings -replace "includeProjects\('Ghidra/Test'\)", "includeProject('IntegrationTest', 'Ghidra/Test', true)"
          $settings | Set-Content "$pwd\settings.gradle"

      - name: Fetch dependencies
        shell: pwsh
        run: |
          $depsDir = "$pwd\dependencies"
          $flatRepo = "$depsDir\flatRepo"
          $dlDir = "$depsDir\downloads"
          $rmiDir = "$depsDir\Debugger-rmi-trace"
          $dbgDir = "$depsDir\Debugger-agent-dbgeng"
          $pyDir = "$depsDir\PyGhidra"
          $gsDir = "$depsDir\GhidraServer"
          $z3Dir = "$depsDir\SymbolicSummaryZ3\os"
          @($flatRepo, $rmiDir, $dbgDir, $pyDir, $gsDir, "$z3Dir\win_arm_64", "$z3Dir\win_x86_64", $dlDir) | ForEach-Object {
            New-Item -ItemType Directory -Force -Path $_ | Out-Null
          }
          $progressPreference = 'silentlyContinue'
          function dl($url, $out) { Invoke-WebRequest -Uri $url -OutFile $out }

          # ---- Core deps ----
          Write-Output "::group::Core deps"
          dl "https://github.com/NationalSecurityAgency/ghidra-data/raw/Ghidra_12.1.2/lib/java-sarif-2.1-modified.jar" "$flatRepo\java-sarif-2.1-modified.jar"
          dl "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/android4me/AXMLPrinter2.jar" "$flatRepo\AXMLPrinter2.jar"
          dl "https://github.com/NationalSecurityAgency/ghidra-data/raw/Ghidra_12.1.2/Debugger/dbgmodel.tlb" "$dbgDir\dbgmodel.tlb"
          Write-Output "::endgroup::"

          # ---- YAJSW (use curl -L for SourceForge redirect chain) ----
          Write-Output "::group::YAJSW"
          $yajswUrl = "https://sourceforge.net/projects/yajsw/files/yajsw/yajsw-stable-13.18/yajsw-stable-13.18.zip/download"
          $yajswOut = "$gsDir\yajsw-stable-13.18.zip"
          # Use curl.exe which handles SourceForge redirects better than Invoke-WebRequest
          curl.exe -L -o $yajswOut $yajswUrl 2>&1
          # Verify it's a valid ZIP
          if (-not (Test-Path $yajswOut) -or (Get-Item $yajswOut).Length -lt 10000) {
            throw "yajsw download failed or too small"
          }
          Write-Output "::endgroup::"

          # ---- Z3 ----
          Write-Output "::group::Z3"
          $linuxZip = "$dlDir\z3-4.13.0-x64-glibc-2.31.zip"
          $winZip = "$dlDir\z3-4.13.0-x64-win.zip"
          $winArmZip = "$dlDir\z3-4.13.0-arm64-win.zip"
          dl "https://github.com/Z3Prover/z3/releases/download/z3-4.13.0/z3-4.13.0-x64-glibc-2.31.zip" $linuxZip
          dl "https://github.com/Z3Prover/z3/releases/download/z3-4.13.0/z3-4.13.0-x64-win.zip" $winZip
          dl "https://github.com/Z3Prover/z3/releases/download/z3-4.13.0/z3-4.13.0-arm64-win.zip" $winArmZip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($linuxZip)
          $z.Entries | Where-Object { $_.Name -like "*.jar" } | ForEach-Object {
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($_, "$flatRepo\$($_.Name)", $true)
          }
          $z.Dispose()
          $z2 = [System.IO.Compression.ZipFile]::OpenRead($winZip)
          $z2.Entries | Where-Object { $_.Name -like "libz3*" } | ForEach-Object {
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($_, "$z3Dir\win_x86_64\$($_.Name)", $true)
          }
          $z2.Dispose()
          $z3 = [System.IO.Compression.ZipFile]::OpenRead($winArmZip)
          $z3.Entries | Where-Object { $_.Name -like "libz3*" } | ForEach-Object {
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($_, "$z3Dir\win_arm_64\$($_.Name)", $true)
          }
          $z3.Dispose()
          Write-Output "::endgroup::"

          # ---- Python wheels for Debugger-rmi-trace ----
          Write-Output "::group::Debugger-rmi-trace wheels"
          dl "https://files.pythonhosted.org/packages/a3/dc/17031897dae0efacfea57dfd3a82fdd2a2aeb58e0ff71b77b87e44edc772/setuptools-80.9.0-py3-none-any.whl" "$rmiDir\setuptools-80.9.0-py3-none-any.whl"
          dl "https://files.pythonhosted.org/packages/0b/2c/87f3254fd8ffd29e4c02732eee68a83a1d3c346ae39bc6822dcbcb697f2b/wheel-0.45.1-py3-none-any.whl" "$rmiDir\wheel-0.45.1-py3-none-any.whl"
          dl "https://files.pythonhosted.org/packages/ee/01/1ed1d482960a5718fd99c82f6d79120181947cfd4667ec3944d448ed44a3/protobuf-6.31.0-py3-none-any.whl" "$rmiDir\protobuf-6.31.0-py3-none-any.whl"
          dl "https://files.pythonhosted.org/packages/90/c7/6dc0a455d111f68ee43f27793971cf03fe29b6ef972042549db29eec39a2/psutil-5.9.8.tar.gz" "$rmiDir\psutil-5.9.8.tar.gz"
          Write-Output "::endgroup::"

          # ---- Python wheels for Debugger-agent-dbgeng ----
          Write-Output "::group::Debugger-agent-dbgeng wheels"
          dl "https://files.pythonhosted.org/packages/5e/a2/52084698c0a3c7e7a94ddfff26f83df09a50781b8436f6f203f5de0a457c/pybag-2.2.16-py3-none-any.whl" "$dbgDir\pybag-2.2.16-py3-none-any.whl"
          dl "https://files.pythonhosted.org/packages/66/95/f30c80615fda0d3c0ee6493ac9db61183313b43499b62dec136773b0e870/comtypes-1.4.13-py3-none-any.whl" "$dbgDir\comtypes-1.4.13-py3-none-any.whl"
          dl "https://files.pythonhosted.org/packages/92/3a/658eb3ba88f067662be280f8f1aec07a70c96bac77e9edc48b1be38e446b/win32more-0.7.0-py3-none-any.whl" "$dbgDir\win32more-0.7.0-py3-none-any.whl"
          dl "https://files.pythonhosted.org/packages/f6/49/cff21fc3adcac1fe19f9f2e50278553fe13b9ac702be569c97f85292481d/win32more_appsdk-0.7.3-py2.py3-none-any.whl" "$dbgDir\win32more_appsdk-0.7.3-py2.py3-none-any.whl"
          dl "https://files.pythonhosted.org/packages/81/bc/7c1c5609f835d3e719c944714638a7a70bbfef6b990c251c32c1cd82d67a/win32more_core-0.7.0-py2.py3-none-any.whl" "$dbgDir\win32more_core-0.7.0-py2.py3-none-any.whl"
          dl "https://files.pythonhosted.org/packages/b5/6d/d58b223be7cff571527d91a3626089cb4da614dcba461811dcf18449f0f9/win32more_microsoft_graphics_win2d-0.7.1.3.2-py2.py3-none-any.whl" "$dbgDir\win32more_microsoft_graphics_win2d-0.7.1.3.2-py2.py3-none-any.whl"
          dl "https://files.pythonhosted.org/packages/6c/8e/fdfc9f796aad6b622ff197b3e58c9689db95482dbf7817cd99d351b54719/win32more_microsoft_web_webview2-0.7.1.0.3650.58-py2.py3-none-any.whl" "$dbgDir\win32more_microsoft_web_webview2-0.7.1.0.3650.58-py2.py3-none-any.whl"
          dl "https://files.pythonhosted.org/packages/56/d7/0bb36964811a23f262cdddb1e5b91fdbd2f494990d48e657f15108f04855/win32more_microsoft_windows_sdk_contracts-0.7.10.0.26100.6901-py2.py3-none-any.whl" "$dbgDir\win32more_microsoft_windows_sdk_contracts-0.7.10.0.26100.6901-py2.py3-none-any.whl"
          dl "https://files.pythonhosted.org/packages/e5/37/8706eb126fc52e59526304aa89ee30771a894e489aa0ea835f101e499b17/win32more_microsoft_windows_sdk_win32metadata-0.7.68.0.4-py2.py3-none-any.whl" "$dbgDir\win32more_microsoft_windows_sdk_win32metadata-0.7.68.0.4-py2.py3-none-any.whl"
          dl "https://files.pythonhosted.org/packages/ef/7c/9630708dd252e0c5c7c9975d52ba0deea996e9b0cf29784d521ac30f3a48/win32more_microsoft_windowsappsdk-0.7.1.8.251106002-py2.py3-none-any.whl" "$dbgDir\win32more_microsoft_windowsappsdk-0.7.1.8.251106002-py2.py3-none-any.whl"
          # capstone, pywin32, and jpype1 have no win_arm64 wheels; build from source
          $arch = (Get-WmiObject Win32_Processor).Architecture
          if ($arch -eq 12) {  # ARM64
            Write-Output "Building capstone from source for ARM64 ..."
            pip wheel --wheel-dir "$dbgDir" "capstone==5.0.6" 2>&1
            Write-Output "Building pywin32 from source for ARM64 ..."
            pip wheel --wheel-dir "$dbgDir" "pywin32==311" 2>&1
            Write-Output "Building jpype1 from source for ARM64 ..."
            pip wheel --wheel-dir "$pyDir" "jpype1==1.5.2" 2>&1
            # Rename ARM64 wheels to the filenames expected by distributePyDep
            Get-ChildItem "$dbgDir\capstone-*.whl" | ForEach-Object {
              $old = "$dbgDir\capstone-5.0.6-py3-none-win_amd64.whl"
              if ($_.FullName -ne $old) { Copy-Item $_.FullName $old -Force }
            }
            Get-ChildItem "$dbgDir\pywin32-311-*.whl" | ForEach-Object {
              $old = "$dbgDir\pywin32-311-cp314-cp314-win_amd64.whl"
              if ($_.FullName -ne $old) { Copy-Item $_.FullName $old -Force }
            }
            Get-ChildItem "$pyDir\jpype1-1.5.2-*.whl" | ForEach-Object {
              $old = "$pyDir\jpype1-1.5.2-cp314-cp314-win_amd64.whl"
              if ($_.FullName -ne $old) { Copy-Item $_.FullName $old -Force }
            }
          } else {
            dl "https://files.pythonhosted.org/packages/da/72/ff7894c2fb5716d9a3ce9c27ba34b29d991a11d8442d2ef0fcdc5564ba7e/capstone-5.0.6-py3-none-win_amd64.whl" "$dbgDir\capstone-5.0.6-py3-none-win_amd64.whl"
            dl "https://files.pythonhosted.org/packages/90/4b/07c77d8ba0e01349358082713400435347df8426208171ce297da32c313d/pywin32-311-cp314-cp314-win_amd64.whl" "$dbgDir\pywin32-311-cp314-cp314-win_amd64.whl"
          }
          Write-Output "::endgroup::"

          # ---- Python wheels for PyGhidra ----
          Write-Output "::group::PyGhidra wheels"
          Copy-Item "$rmiDir\setuptools-80.9.0-py3-none-any.whl" "$pyDir\"
          Copy-Item "$rmiDir\wheel-0.45.1-py3-none-any.whl" "$pyDir\"
          dl "https://files.pythonhosted.org/packages/20/12/38679034af332785aac8774540895e234f4d07f7545804097de4b666afd8/packaging-25.0-py3-none-any.whl" "$pyDir\packaging-25.0-py3-none-any.whl"
          Write-Output "::endgroup::"

      # Build protoc from source for ARM64 (no official Windows ARM64 release)
      - name: Build protoc ARM64
        shell: pwsh
        run: |
          $outDir = "$pwd\build\protoc-arm64"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $ver = "4.31.0"
          Write-Output "Downloading protobuf $ver source ..."
          curl.exe -L -o "$env:RUNNER_TEMP\protobuf.zip" `
            "https://github.com/protocolbuffers/protobuf/archive/refs/tags/v$ver.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\protobuf.zip" -DestinationPath "$env:RUNNER_TEMP\" -Force
          Remove-Item -Force "$env:RUNNER_TEMP\protobuf.zip"
          $srcDir = Get-ChildItem "$env:RUNNER_TEMP\protobuf-*" | Select-Object -First 1 -ExpandProperty FullName
          Write-Output "Source directory: ${srcDir}"
          $buildDir = "$env:RUNNER_TEMP\protobuf-arm64"
          Write-Output "Building protoc from source for ARM64 ..."
          cmake -S "$srcDir" -B "$buildDir" `
            -G "Visual Studio 17 2022" -A ARM64 `
            -DCMAKE_BUILD_TYPE=Release `
            -Dprotobuf_BUILD_TESTS=OFF `
            -Dprotobuf_BUILD_EXAMPLES=OFF `
            -Dprotobuf_BUILD_PROTOC_BINARIES=ON `
            -Dprotobuf_BUILD_LIBPROTOC=OFF `
            -Dprotobuf_MSVC_STATIC_RUNTIME=OFF
          cmake --build "$buildDir" --config Release --target protoc -j 4
          $builtProtoc = Get-ChildItem "$buildDir\Release\protoc.exe" -Recurse | Select-Object -First 1
          if (-not $builtProtoc) {
            $builtProtoc = Get-ChildItem "$buildDir\protoc.exe" -Recurse | Select-Object -First 1
          }
          if (-not $builtProtoc) { throw "protoc build failed: exe not found" }
          Copy-Item $builtProtoc.FullName "$outDir\protoc.exe" -Force
          Write-Output "ARM64 protoc built and placed at $outDir\protoc.exe"

      - name: Build Ghidra
        shell: pwsh
        run: |
          pip install setuptools wheel --quiet
          gradle buildGhidra -x createJavadocs -x createJsondocs -x createPythonTypeStubs -x createGhidraStubsWheel --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-12.1.2-win-arm64
          path: build/dist/*.zip
