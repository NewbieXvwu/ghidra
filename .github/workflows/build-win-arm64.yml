name: Build Ghidra 12.1.2 Windows ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - build-win-arm64

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Ghidra_12.1.2_build

      - name: Setup Java
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME_21_AARCH64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate Gradle 8.12 wrapper
        shell: pwsh
        run: |
          $tmpDir = "$env:TEMP\gradle-gen"
          $srcDir = "$pwd"
          New-Item -ItemType Directory -Force -Path $tmpDir
          Set-Location $tmpDir
          "" | Out-File -FilePath "build.gradle" -Encoding ascii
          gradle wrapper --gradle-version 8.12 --no-daemon
          if (Test-Path "$tmpDir\gradlew") {
            Copy-Item "$tmpDir\gradlew" "$srcDir\gradlew" -Force
            Copy-Item "$tmpDir\gradlew.bat" "$srcDir\gradlew.bat" -Force
            New-Item -ItemType Directory -Force -Path "$srcDir\gradle\wrapper"
            Copy-Item "$tmpDir\gradle\wrapper\gradle-wrapper.jar" "$srcDir\gradle\wrapper\gradle-wrapper.jar" -Force
            Copy-Item "$tmpDir\gradle\wrapper\gradle-wrapper.properties" "$srcDir\gradle\wrapper\gradle-wrapper.properties" -Force
          }
          Set-Location $srcDir

      - name: Patch settings.gradle for ARM64
        shell: pwsh
        run: |
          (Get-Content "$pwd\settings.gradle") -replace "includeProjects\('Ghidra/Test'\)", "includeProject('IntegrationTest', 'Ghidra/Test', true)" | Set-Content "$pwd\settings.gradle"

      - name: Fetch dependencies
        shell: pwsh
        run: |
          $depsDir = "$pwd\dependencies"
          $flatRepo = "$depsDir\flatRepo"
          New-Item -ItemType Directory -Force -Path $flatRepo
          $dbgDir = "$depsDir\Debugger-agent-dbgeng"
          New-Item -ItemType Directory -Force -Path $dbgDir
          $progressPreference = 'silentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/NationalSecurityAgency/ghidra-data/raw/Ghidra_12.1.2/lib/java-sarif-2.1-modified.jar" -OutFile "$flatRepo\java-sarif-2.1-modified.jar"
          Invoke-WebRequest -Uri "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/android4me/AXMLPrinter2.jar" -OutFile "$flatRepo\AXMLPrinter2.jar"
          Invoke-WebRequest -Uri "https://github.com/NationalSecurityAgency/ghidra-data/raw/Ghidra_12.1.2/Debugger/dbgmodel.tlb" -OutFile "$dbgDir\dbgmodel.tlb"

      - name: Build Ghidra
        shell: pwsh
        run: .\gradlew buildGhidra -x createJavadocs -x createJsondocs -x createPythonTypeStubs -x createGhidraStubsWheel --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-12.1.2-win-arm64
          path: build/dist/*.zip
