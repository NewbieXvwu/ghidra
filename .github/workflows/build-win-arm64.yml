name: Build Ghidra 12.1.2 Windows ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - build-win-arm64

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Ghidra_12.1.2_build

      - name: Setup Java
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME_21_AARCH64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Patch settings for Gradle 9 and ARM64
        shell: pwsh
        run: |
          # Fix includeProjectNamed for Gradle 9 compatibility - use settings.file() instead of new File()
          $util = Get-Content "$pwd\gradle\support\settingsUtil.gradle" -Raw
          $util = $util -replace "File projectDir = new File\(rootProject\.projectDir, `"\$path/\$dirName`"\)", "def projectDir = settings.file(`"\$path/\$dirName`")"
          $util | Set-Content "$pwd\gradle\support\settingsUtil.gradle"

          # Exclude DebuggerIntegrationTest to avoid WindowsRegistry issue on ARM64
          $settings = Get-Content "$pwd\settings.gradle"
          $settings = $settings -replace "includeProjects\('Ghidra/Test'\)", "includeProject('IntegrationTest', 'Ghidra/Test', true)"
          $settings | Set-Content "$pwd\settings.gradle"

      - name: Patch fetchDependencies.gradle
        shell: pwsh
        run: |
          # Fix yajsw URL: SourceForge needs /download suffix or it returns HTML
          $f = Get-Content "$pwd\gradle\support\fetchDependencies.gradle" -Raw
          $f = $f -replace '"https://sourceforge.net/projects/yajsw/files/yajsw/yajsw-stable-13.18/yajsw-stable-13.18.zip"', '"https://sourceforge.net/projects/yajsw/files/yajsw/yajsw-stable-13.18/yajsw-stable-13.18.zip/download"'
          $f | Set-Content "$pwd\gradle\support\fetchDependencies.gradle"

      - name: Fetch dependencies (Gradle init script)
        shell: pwsh
        run: |
          gradle -I gradle/support/fetchDependencies.gradle init --no-daemon 2>&1

      - name: Extract Z3 native libraries
        shell: pwsh
        run: |
          $depsDir = "$pwd\dependencies"
          $flatRepo = "$depsDir\flatRepo"
          $z3Dir = "$depsDir\SymbolicSummaryZ3\os"
          # Ensure Z3 jar is in flatRepo (extract from Linux zip)
          $linuxZip = "$depsDir\downloads\z3-4.13.0-x64-glibc-2.31.zip"
          if (Test-Path $linuxZip) {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($linuxZip)
            $zip.Entries | Where-Object { $_.Name -like "*.jar" } | ForEach-Object {
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($_, "$flatRepo\$($_.Name)", $true)
            }
            $zip.Dispose()
          }
          # Extract win x64 DLLs into win_arm_64 (works via x64 emulation)
          $winZip = "$depsDir\downloads\z3-4.13.0-x64-win.zip"
          if (Test-Path $winZip) {
            New-Item -ItemType Directory -Force -Path "$z3Dir\win_arm_64"
            $zip2 = [System.IO.Compression.ZipFile]::OpenRead($winZip)
            $zip2.Entries | Where-Object { $_.Name -like "libz3*" } | ForEach-Object {
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($_, "$z3Dir\win_arm_64\$($_.Name)", $true)
            }
            $zip2.Dispose()
          }
          # Also extract Z3 DLLs for win_x86_64 (needed for assembly checks)
          New-Item -ItemType Directory -Force -Path "$z3Dir\win_x86_64"
          if (Test-Path $winZip) {
            $zip3 = [System.IO.Compression.ZipFile]::OpenRead($winZip)
            $zip3.Entries | Where-Object { $_.Name -like "libz3*" } | ForEach-Object {
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($_, "$z3Dir\win_x86_64\$($_.Name)", $true)
            }
            $zip3.Dispose()
          }

      - name: Build Ghidra
        shell: pwsh
        run: |
          pip install setuptools wheel --quiet
          gradle buildGhidra -x createJavadocs -x createJsondocs -x createPythonTypeStubs -x createGhidraStubsWheel --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-12.1.2-win-arm64
          path: build/dist/*.zip
