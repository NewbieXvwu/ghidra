name: Build Ghidra 12.1.2 Windows ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - build-win-arm64

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Ghidra_12.1.2_build

      - name: Setup Java
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME_21_AARCH64" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo $env:JAVA_HOME_21_AARCH64

      - name: Setup Gradle 8.12
        shell: pwsh
        run: |
          $gradleVersion = "8.12"
          $wrapperDir = "$pwd\gradle\wrapper"
          New-Item -ItemType Directory -Force -Path $wrapperDir
          $wrapperJarUrl = "https://raw.githubusercontent.com/gradle/gradle/v${gradleVersion}/gradle/wrapper/gradle-wrapper.jar"
          $progressPreference = 'silentlyContinue'
          Invoke-WebRequest -Uri $wrapperJarUrl -OutFile "$wrapperDir\gradle-wrapper.jar"
          @"
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-${gradleVersion}-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          "@ | Out-File -FilePath "$wrapperDir\gradle-wrapper.properties" -Encoding ascii

      - name: Fetch dependencies
        shell: pwsh
        run: |
          # Download dependencies manually using PowerShell
          $depsDir = "$pwd\dependencies"
          $flatRepo = "$depsDir\flatRepo"
          New-Item -ItemType Directory -Force -Path $flatRepo
          $downloadsDir = "$depsDir\downloads"
          New-Item -ItemType Directory -Force -Path $downloadsDir

          function Download-File($url, $outFile) {
            Write-Host "Downloading $url"
            $progressPreference = 'silentlyContinue'
            Invoke-WebRequest -Uri $url -OutFile $outFile
          }

          Download-File "https://github.com/NationalSecurityAgency/ghidra-data/raw/Ghidra_12.1.2/lib/java-sarif-2.1-modified.jar" "$flatRepo\java-sarif-2.1-modified.jar"
          Download-File "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/android4me/AXMLPrinter2.jar" "$flatRepo\AXMLPrinter2.jar"
          Download-File "https://github.com/NationalSecurityAgency/ghidra-data/raw/Ghidra_12.1.2/Debugger/dbgmodel.tlb" "$depsDir\Debugger-agent-dbgeng\dbgmodel.tlb"
          Write-Host "Dependencies downloaded"

      - name: Build Ghidra
        shell: pwsh
        run: .\gradlew buildGhidra -x createJavadocs -x createJsondocs -x createPythonTypeStubs -x createGhidraStubsWheel --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-12.1.2-win-arm64
          path: build/dist/*.zip
