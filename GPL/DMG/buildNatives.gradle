// Native build files are already applied in development mode (indicated by presence of the
// Generic project).  Only need to apply them if we are in a distribution.
if (findProject(':Generic') == null) {
	apply from: "../../../GPL/utils.gradle"
	apply from: "../../../GPL/nativePlatforms.gradle"
	apply from: "../../../GPL/nativeBuildProperties.gradle"
}

def getJNIIncludeArgs() {
	def javaHome = project.JAVA_HOME
	def jniInclude = javaHome + "/include"
	def jniPlatformInclude = javaHome + "/include/win32"
	return ["-I" + jniInclude, "-I" + jniPlatformInclude]
}

model {
	components {
		llio_amd64(NativeLibrarySpec) {
			baseName "llio_amd64"
			targetPlatform "win_x86_64"
			sources {
				c {
					source {
						srcDir "src/llio/c"
						include "llio_common.c"
						include "org_catacombae_hfsexplorer_win32_WindowsLowLevelIO.c"
						include "org_catacombae_hfsexplorer_win32_WritableWin32File.c"
					}
				}
			}
		}
		llio_arm64(NativeLibrarySpec) {
			baseName "llio_arm64"
			targetPlatform "win_arm_64"
			sources {
				c {
					source {
						srcDir "src/llio/c"
						include "llio_common.c"
						include "org_catacombae_hfsexplorer_win32_WindowsLowLevelIO.c"
						include "org_catacombae_hfsexplorer_win32_WritableWin32File.c"
					}
				}
			}
		}
	}

	binaries {
		all{ b ->
			if (b.toolChain in VisualCpp) {
				if (b.targetPlatform.operatingSystem.windows) {
					b.cCompiler.define "WINDOWS"
					b.cCompiler.define "_WINDOWS"
					b.cCompiler.define "WIN32"
					b.cCompiler.define "_WIN32"
					b.cCompiler.define "_CRT_SECURE_NO_DEPRECATE"
					b.cCompiler.define "_CRT_NONSTDC_NO_DEPRECATE"
					b.cCompiler.args "/O2"
					b.cCompiler.args getJNIIncludeArgs()
				}
			}
			else if (b.toolChain in Gcc) {
				b.cCompiler.args "-std=c99"
				b.cCompiler.args "-Wall"
				b.cCompiler.args "-O2"
				b.cCompiler.args "-D_JNI_IMPLEMENTATION_"
				b.cCompiler.args "-Wl,--kill-at"
				b.cCompiler.args getJNIIncludeArgs()
			}
			else if (b.toolChain in Clang) {
				b.cCompiler.args "-std=c99"
				b.cCompiler.args "-Wall"
				b.cCompiler.args "-O2"
				b.cCompiler.args getJNIIncludeArgs()
			}
		}
	}
}
