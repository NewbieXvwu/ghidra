if (findProject(':Generic') != null) {
	apply from: "$rootProject.projectDir/gradle/javaProject.gradle"
	apply from: "$rootProject.projectDir/gradle/distributableGPLModule.gradle"
	apply from: "$rootProject.projectDir/gradle/nativeProject.gradle"
	apply from: "buildNatives.gradle"
	
	rootProject.assembleDistribution {
		doLast {
			// eliminate standard module lib directory
			def assemblePath = destinationDir.path + "/" + getZipPath(this.project)
			delete assemblePath + "/lib"
		}
	}
	
}
else {
	apply plugin: 'java-library'
}
apply plugin: 'eclipse'

eclipse.project.name = 'GPL DMG'

/*********************************************************************************
 *
 * Define a new source set for dmg source because it is not part of Ghidra, it is 
 * a standalone application that is executed and called from Ghidra. 
 *  			
 * see DmgServerProcessManager 
 *
 *********************************************************************************/
sourceSets {
	
	dmg {
		java {
			srcDir 'src/dmg/java'
		}
	}
}

repositories {
	flatDir name: "flat", dirs:["data/lib"]
}

dependencies {
	dmgImplementation ':csframework@jar'
	dmgImplementation ':hfsx@jar'
	dmgImplementation ':hfsx_dmglib@jar'
}

/***************************************************************************************
 *
 * Task to create the DMG.jar file
 *
 ***************************************************************************************/

jar {
	destinationDirectory = file("build/data/lib")
	from sourceSets.dmg.output
}

/***************************************************************************************
 *
 * Build llio_arm64.dll from llio C source using CMake (for Windows ARM64 native support).
 * Only runs on Windows with cmake and Visual Studio 2022 installed.
 * Equivalent to the Gradle-native model in buildNatives.gradle but compatible with Gradle 9+.
 *
 ***************************************************************************************/
task buildLlioWinARM64 {
	outputs.upToDateWhen { false }

	doLast {
		if (!System.properties['os.name'].toLowerCase().contains('windows')) {
			return
		}

		def srcDir = project.file('src/llio')
		def cmakeBuildDir = project.file("${buildDir}/llio-arm64")
		def outDir = project.file("data/os/win_arm_64")

		cmakeBuildDir.mkdirs()
		outDir.mkdirs()

		logger.lifecycle("Configuring llio CMake for Windows ARM64 ...")
		def cfg = [ 'cmake', "-G", "Visual Studio 17 2022", "-A", "ARM64",
			"-DCMAKE_BUILD_TYPE=Release",
			"-DJAVA_HOME=${project.JAVA_HOME}",
			srcDir.toString() ].execute(null, cmakeBuildDir)
		cfg.waitFor()
		if (cfg.exitValue() != 0) {
			logger.warn("CMake configure failed for Windows ARM64 llio, skipping.")
			return
		}

		logger.lifecycle("Building llio_arm64.dll ...")
		def build = [ 'cmake', '--build', '.', '--config', 'Release' ].execute(null, cmakeBuildDir)
		build.waitFor()
		if (build.exitValue() != 0) {
			logger.warn("CMake build failed for llio ARM64 native library.")
			return
		}

		def srcFile = new File("${cmakeBuildDir}/Release/llio_arm64.dll")
		if (srcFile.exists()) {
			new File(outDir, "llio_arm64.dll").bytes = srcFile.bytes
		}
		logger.lifecycle("llio_arm64.dll built and installed successfully.")
	}
}

assemble.dependsOn buildLlioWinARM64
